name: CI

# Runs on every push to main and every pull request. The release workflow reuses it through `workflow_call`
# so a tagged release is always built by exactly the same jobs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q clang-format-18

      - name: Check formatting
        run: find include src tests \( -name '*.h' -o -name '*.cpp' \) | xargs clang-format-18 --dry-run --Werror

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_64

      - name: Configure
        run: cmake --preset tests

      - name: Build
        run: cmake --build --preset tests

      - name: Test
        run: ctest --preset tests

  build:
    name: Build (${{ matrix.name }})
    needs: [format, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Set up Clang and libc++
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q clang libc++-18-dev libc++abi-18-dev ninja-build
          clang --version

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_64

      - name: Configure
        run: cmake --preset ${{ matrix.name }}

      - name: Build
        run: cmake --build --preset ${{ matrix.name }}

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: endstone-maintenance-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/${{ matrix.name }}/endstone_*.so
            build/${{ matrix.name }}/endstone_*.dll
            build/${{ matrix.name }}/endstone_*.pdb
