name: Endstone update check

# Endstone is fetched by git tag from CMakeLists.txt, which Dependabot cannot track.
# This opens (at most one) issue whenever a newer stable Endstone release exists.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare pinned and latest Endstone tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n 's/^set(ENDSTONE_VERSION "\(v[0-9.]*\)".*/\1/p' CMakeLists.txt | head -n 1)
          latest=$(git ls-remote --tags --refs https://github.com/EndstoneMC/endstone.git 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "pinned=${current} latest=${latest}"

          if [ -z "$current" ] || [ -z "$latest" ]; then
            echo "::error::Could not determine versions"; exit 1
          fi
          if [ "$current" = "$latest" ] || [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "Up to date."; exit 0
          fi

          title="Update Endstone to ${latest}"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "Issue already open."; exit 0
          fi
          gh issue create --title "$title" --label dependencies \
            --body "Endstone ${latest} is available (currently pinned to ${current}). Bump \`ENDSTONE_VERSION\` in \`CMakeLists.txt\`, rebuild, and check the Endstone release notes for API changes."
